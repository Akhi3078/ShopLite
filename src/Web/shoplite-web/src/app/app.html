<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-semibold" routerLink="/products">
      <i class="bi bi-bag-check me-2"></i>ShopLite
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#nav"
      aria-controls="nav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      @if (auth.isAuthenticated()) {
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/products" routerLinkActive="active">Products</a>
          </li>

          <!-- Role-gated navigation. The route is guarded too; hiding the link just
               avoids offering something that would be refused. -->
          @if (isAdmin()) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/users" routerLinkActive="active">
                <i class="bi bi-people me-1"></i>Users
              </a>
            </li>
          }
        </ul>

        <div class="d-flex align-items-center gap-3">
          <div class="text-end text-white">
            <div class="small fw-semibold">{{ auth.displayName() }}</div>
            <div>
              @for (role of auth.roles(); track role) {
                <span class="badge bg-light text-primary role-badge me-1">{{ role }}</span>
              }
            </div>
          </div>
          <button class="btn btn-sm btn-outline-light" type="button" (click)="logout()">
            Sign out
          </button>
        </div>
      } @else {
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">Sign in</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/register" routerLinkActive="active">Register</a>
          </li>
        </ul>
      }
    </div>
  </div>
</nav>

<main class="page">
  <router-outlet />
</main>
